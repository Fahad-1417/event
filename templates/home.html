<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{{ page_title|default:"نظام إدارة الفعاليات" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      direction: rtl;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e3a8a;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    footer {
      background-color: #1e3a8a;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

  {% include "header.html" %}

 <main>
  <h2 style="color: #1e3a8a;">{{ page_title }}</h2>
  <p>{{ page_message }}</p>

  {% if events %}
    <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px;">
      {% for event in events %}
        <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 270px;">
          <h3 style="margin-top: 0; color: #2563eb;">{{ event.name }}</h3>
          <p style="margin: 10px 0;">{{ event.description }}</p>
          <p style="font-weight: bold;">السعر: {{ event.price }} ريال</p>
        </div>
      {% endfor %}
    </div>
  {% endif %}
</main>

  {% include "footer.html" %}

</body>
</html>
