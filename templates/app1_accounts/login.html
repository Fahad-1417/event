<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      direction: rtl;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 160px); /* تقليل الهيدر والفوتر */
    }

    .login-box {
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      width: 400px;
      max-width: 90%;
      text-align: center;
    }

    .login-box h2 {
      color: #1e3a8a;
      margin-bottom: 25px;
    }

    .login-box label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      text-align: right;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #e8f0fe;
    }

    .login-box button {
      margin-top: 20px;
      background-color: #1e3a8a;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-box .note {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  {% include "header.html" %}

  <main>
    <div class="login-box">
      <h2>تسجيل الدخول</h2>
      <form method="post">
        {% csrf_token %}
        <label for="username">اسم المستخدم:</label>
        {{ form.username }}

        <label for="password">كلمة المرور:</label>
        {{ form.password }}

        <button type="submit">دخول</button>

        {% if form.errors %}
          <p style="color: red; margin-top: 10px;">{{ form.errors }}</p>
        {% endif %}
      </form>

      <p class="note">أدخل اسم المستخدم وكلمة المرور للمتابعة</p>
    </div>
  </main>

  {% include "footer.html" %}

</body>
</html>
