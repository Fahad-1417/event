<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      direction: rtl;
    }

    main {
      padding: 40px 20px;
      max-width: 1200px;
      margin: auto;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .event-card {
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: right;
      transition: transform 0.3s ease;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card h3 {
      color: #1e3a8a;
      margin-top: 0;
    }

    .event-card .price {
      font-weight: bold;
      color: #10b981;
    }
  </style>
</head>
<body>

  {% include "header.html" %}

  <main>
    <h1>{{ page_title }}</h1>
    <p>{{ page_message }}</p>

    <div class="grid">
      {% for event in events %}
        <div class="event-card">
          <h3>{{ event.name }}</h3>
          <p>{{ event.description }}</p>
          <p class="price">السعر: {{ event.price }} ريال</p>
        </div>
      {% endfor %}
    </div>
  </main>

  {% include "footer.html" %}

</body>
</html>
