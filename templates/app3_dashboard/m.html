{% load static %}

<header style="background-color: #1e3a8a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
  <h2 style="margin: 0;">
    <i class="fas fa-calendar-check"></i> نظام إدارة الفعاليات
  </h2>

  <nav style="background-color: #1e3a8a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
    <ul style="list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; align-items: center;">
      <li><a href="{% url 'home' %}" style="color: white; text-decoration: none;"><i class="fa fa-home"></i> الرئيسية</a></li>
      <li><a href="{% url 'events' %}" style="color: white; text-decoration: none;"><i class="fa fa-calendar"></i> الفعاليات</a></li>
      <li><a href="#" style="color: white; text-decoration: none;"><i class="fa fa-pen"></i> حجز فعاليات</a></li>
      <li><a href="#" style="color: white; text-decoration: none;"><i class="fa fa-phone"></i> اتصل بنا</a></li>

     {% if user.is_authenticated %}
  <li>
    <form method="POST" action="{% url 'logout' %}" style="display:inline;">
      {% csrf_token %}
      <button type="submit" style="
        background: none;
        border: none;
        color: white;
        text-decoration: none;
        font: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
      ">
        <i class="fa fa-sign-out-alt"></i> تسجيل الخروج
      </button>
    </form>
  </li>
{% else %}
  <li>
    <a href="{% url 'login' %}" style="color: white; text-decoration: none;">
      <i class="fa fa-sign-in-alt"></i> تسجيل الدخول
    </a>
  </li>
{% endif %}

    </ul>
  </nav>
</header>
